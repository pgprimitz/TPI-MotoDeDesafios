services:
  challenge-engine-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-challenge_engine}
      POSTGRES_USER: ${DB_USER:-challenge_engine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-challenge_engine}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - challenge-engine-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  challenge-engine-postgres-data:
